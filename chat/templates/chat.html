<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpGram AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1e1e2e;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #7b2ff7, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: #666; font-size: 13px; margin-top: 4px; }

        .chat-box {
            width: 100%;
            max-width: 700px;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .user {
            background: linear-gradient(135deg, #7b2ff7, #5a1fd1);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .ai-name {
            font-size: 11px;
            color: #7b2ff7;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .typing {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            align-self: flex-start;
            border-radius: 16px;
            padding: 12px 16px;
            color: #666;
            font-size: 13px;
        }

        .input-area {
            width: 100%;
            max-width: 700px;
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1e1e2e;
        }

        input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: #7b2ff7; }
        input::placeholder { color: #444; }

        button {
            background: linear-gradient(135deg, #7b2ff7, #00d4ff);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">⚡ PumpGram AI</div>
    <div class="subtitle">PumpGram ekotizimining sun'iy intellekti</div>
</div>

<div class="chat-box" id="chatBox">
    <div class="message ai">
        <div class="ai-name">PumpGram AI</div>
        Salom! Men PumpGram AI man 🚀 $PGR tokeni, platforma yoki kripto haqida savollaringiz bormi?
    </div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Xabar yozing..." />
    <button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
    let history = [];

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();
        if (!message) return;

        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        history.push({ role: "user", content: message });
        input.value = '';
        btn.disabled = true;

        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.id = 'typing';
        typing.innerText = 'PumpGram AI yozmoqda...';
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, history: history.slice(0, -1) })
            });

            const data = await res.json();
            document.getElementById('typing').remove();

            chatBox.innerHTML += `
                <div class="message ai">
                    <div class="ai-name">PumpGram AI</div>
                    ${data.reply}
                </div>`;

            history.push({ role: "assistant", content: data.reply });

        } catch (e) {
            document.getElementById('typing').remove();
            chatBox.innerHTML += `<div class="message ai"><div class="ai-name">PumpGram AI</div>Xatolik yuz berdi 😔</div>`;
        }

        btn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
